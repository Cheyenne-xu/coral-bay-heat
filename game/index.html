<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Coral Bay Heat — a top-down open-world crime game: steal cars, lose the Coral Bay police, and run six jobs for fixer Mara Quinn.">
<title>Coral Bay Heat — Open-World Crime Game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0e1420; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Coral Bay Heat: drive and walk around Coral Bay, steal cars, do jobs for Mara Quinn, and lose the police"></canvas>
<noscript><p style="color:#fff;font-family:sans-serif;padding:2rem">Coral Bay Heat needs JavaScript to run — please enable it and reload.</p></noscript>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
